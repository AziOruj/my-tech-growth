name: ask-gemini

# Telefondan söhbət: issue açıb və ya şərh yazıb mətndə "@gemini" qeyd et.
# Sual → cavab issue-ya yazılır. Düzəliş istəyi → fayl dəyişdirilir, main-ə push olunur.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ask-gemini-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ask:
    # Yalnız repo sahibi; "@gemini" qeyd olunanda və ya "daily" issue-sundakı hər şərhdə.
    # Botun öz şərhlərinə reaksiya vermir (actor github-actions olur).
    if: >-
      github.actor == 'AziOruj' &&
      (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@gemini') || contains(github.event.issue.title, '@gemini') || contains(github.event.issue.body, '/gemini') || contains(github.event.issue.title, '/gemini'))) ||
        (github.event_name == 'issue_comment' &&
          (contains(github.event.comment.body, '@gemini') || contains(github.event.comment.body, '/gemini') ||
           contains(github.event.issue.labels.*.name, 'daily')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: "👀 reaksiyası (qəbul edildi)"
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$ISSUE/reactions" -f content=eyes >/dev/null
          fi

      - name: Söhbət tarixçəsini topla
        run: |
          {
            echo "# Issue #$ISSUE: $(gh issue view "$ISSUE" --json title -q .title)"
            echo
            gh issue view "$ISSUE" --json body -q .body
            echo
            gh issue view "$ISSUE" --json comments \
              -q '.comments[] | "\n---\n**\(.author.login)**:\n\(.body)"'
          } > "$RUNNER_TEMP/thread.md"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Gemini (1 API sorğusu)
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/gemini.mjs ask "$RUNNER_TEMP/thread.md" "$RUNNER_TEMP/reply.md"

      - name: Dəyişiklikləri push et
        id: push
        run: |
          git add -A daily/ topics.md CLAUDE.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "AziOruj"
            git config user.email "85117267+AziOruj@users.noreply.github.com"
            git commit -m "edit via issue #$ISSUE"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cavabı issue-ya yaz
        if: always()
        env:
          CHANGED: ${{ steps.push.outputs.changed }}
          SHA: ${{ steps.push.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPLY="$RUNNER_TEMP/reply.md"
          if [ ! -s "$REPLY" ]; then
            printf '⚠️ Cavab hazırlanmadı. Run log: %s\n' "$RUN_URL" > "$REPLY"
          fi
          if [ "$CHANGED" = "true" ]; then
            printf '\n---\n✅ Dəyişiklik main-ə push olundu: `%s`\n' "$SHA" >> "$REPLY"
          fi
          gh issue comment "$ISSUE" --body-file "$REPLY"
