name: daily-ai-java-mentor

on:
  schedule:
    - cron: "0 4 * * *"   # hər gün 08:00 Asia/Baku (04:00 UTC); GitHub cron 5-30 dəq gecikə bilər
  workflow_dispatch:       # əl ilə işə salmaq üçün (Actions tab → Run workflow)
    inputs:
      date:
        description: "Tarix (YYYY-MM-DD). Boş = bu gün (Asia/Baku)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Bugünkü tarix və təkrar yoxlaması
        id: day
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DAY=${INPUT_DATE:-$(TZ=Asia/Baku date +%F)}
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Tarix formatı səhvdir: $DAY"; exit 1; }
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          if ls daily/"$DAY"-*.md >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$DAY üçün fayl artıq var, keçilir."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7.1.0
        if: steps.day.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Gemini ilə günün mövzusunu yarat (1 API sorğusu)
        if: steps.day.outputs.exists == 'false'
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/gemini.mjs daily "${{ steps.day.outputs.date }}"

      - name: Nəticəni yoxla
        if: steps.day.outputs.exists == 'false'
        run: |
          DAY=${{ steps.day.outputs.date }}
          ls daily/"$DAY"-*.md >/dev/null 2>&1 || { echo "::error::Gündəlik fayl yaradılmadı"; exit 1; }
          grep -q "$DAY" topics.md || { echo "::error::topics.md yenilənmədi"; exit 1; }

      - name: Commit və push
        if: steps.day.outputs.exists == 'false'
        run: |
          git config user.name "AziOruj"
          git config user.email "85117267+AziOruj@users.noreply.github.com"
          git add daily/ topics.md
          TITLE=$(basename daily/${{ steps.day.outputs.date }}-*.md .md)
          git commit -m "daily: $TITLE"
          git push origin HEAD:main

      - name: Müzakirə issue-su aç
        if: steps.day.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAY: ${{ steps.day.outputs.date }}
        run: |
          FILE=$(ls daily/"$DAY"-*.md | head -1)
          TOPIC=$(grep -m1 '^# ' "$FILE" | sed 's/^# //')
          URL="${{ github.server_url }}/${{ github.repository }}/blob/main/$FILE"
          gh label create daily --color 1D76DB --description "Gündəlik mövzu müzakirəsi" --force >/dev/null
          {
            echo "📖 **Bugünkü mövzu:** [$TOPIC]($URL)"
            echo
            echo "Bu issue-da yazdığın hər şərhə Gemini cavab verir (\`@gemini\` yazmaq lazım deyil)."
            echo
            echo "- Sual: _\"X-i sadə misalla izah et\"_"
            echo "- Tapşırıq: _\"Tapşırığı belə etdim: ... yoxla\"_"
            echo "- Düzəliş: _\"Faylda Y bölməsinə Z əlavə et\"_"
            echo "- Qayda: _\"Qayda kimi yaz: hər gün quiz olsun\"_"
            echo
            echo "Bitirəndə issue-nu bağla."
          } > issue.md
          gh issue create --title "📚 $DAY — $TOPIC" --label daily --body-file issue.md
